<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients & Glows -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30329B"/>
      <stop offset="60%" stop-color="#0B103F"/>
      <stop offset="100%" stop-color="#070A2B"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD21A" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#30329B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070A2B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFD21A"/>
      <stop offset="100%" stop-color="#F5C518"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#30329B"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circular text paths -->
    <!-- Top Arc for HACKATHON -->
    <path id="topTextArc" d="M 90,250 A 160,160 0 1,1 410,250" fill="none"/>
    <!-- Bottom Arc for IT SCHOOL -->
    <path id="bottomTextArc" d="M 410,250 A 160,160 0 0,1 90,250" fill="none"/>
  </defs>

  <!-- Outer Ring with Tech Accents -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Outer Dotted Orbit -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#FFD21A" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- Middle Inner Border -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Ambient Core Glow -->
  <circle cx="250" cy="250" r="125" fill="url(#coreGlow)"/>

  <!-- Left and Right Star/Dot Separators -->
  <circle cx="70" cy="250" r="6" fill="#FFD21A" filter="url(#glow)"/>
  <polygon points="70,240 73,247 80,250 73,253 70,260 67,253 60,250 67,247" fill="#FFF066"/>

  <circle cx="430" cy="250" r="6" fill="#FFD21A" filter="url(#glow)"/>
  <polygon points="430,240 433,247 440,250 433,253 430,260 427,253 420,250 427,247" fill="#FFF066"/>

  <!-- Top Text: HACKATHON -->
  <text fill="#FFFFFF" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="9">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      HACKATHON
    </textPath>
  </text>

  <!-- Bottom Text: IT SCHOOL -->
  <text fill="#FFD21A" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="30" letter-spacing="11">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      IT SCHOOL
    </textPath>
  </text>

  <!-- Center Symbol: Stylized Hexagon + Circuit Tech Core + Mathematical Precision -->
  <g transform="translate(250, 250)">
    <!-- Circuit lines radiating -->
    <path d="M -55,-55 L -85,-85" stroke="#FFD21A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="-85" cy="-85" r="4" fill="#FFD21A"/>

    <path d="M 55,-55 L 85,-85" stroke="#FFD21A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="85" cy="-85" r="4" fill="#FFD21A"/>

    <path d="M -55,55 L -85,85" stroke="#FFD21A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="-85" cy="85" r="4" fill="#FFD21A"/>

    <path d="M 55,55 L 85,85" stroke="#FFD21A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="85" cy="85" r="4" fill="#FFD21A"/>

    <!-- Central Hexagon Base -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#070A2B" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>

    <!-- Tech Code Brackets < / > & Diamond / Lightning / Sigma combination -->
    <!-- Left Bracket < -->
    <path d="M -22,-28 L -42,0 L -22,28" fill="none" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 22,-28 L 42,0 L 22,28" fill="none" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Tech Core: Lightning / Power / Innovation -->
    <path d="M 4,-38 L -14,2 L 4,2 L -4,38 L 16,-2 L -2,-2 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Mini decorative nodes -->
    <circle cx="0" cy="-70" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="-35" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="35" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="70" r="4" fill="#FFFFFF"/>
    <circle cx="-60" cy="35" r="4" fill="#FFFFFF"/>
    <circle cx="-60" cy="-35" r="4" fill="#FFFFFF"/>
  </g>
</svg>
